services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grocery_db
      POSTGRES_USER: grocery_user
      POSTGRES_PASSWORD: grocery_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery_user -d grocery_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U grocery_user -d grocery_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # No host port mapping — local Redis often uses 6379; API reaches this via the Docker network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_NAME: grocery_db
      DB_USER: grocery_user
      DB_PASSWORD: grocery_pass
      DB_MIGRATE_HOST: postgres
      DB_MIGRATE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: info
      TRANSACTION_MAX_RETRIES: 3
      TRANSACTION_RETRY_DELAY_MS: 50
      DB_STATEMENT_TIMEOUT_MS: 5000
    restart: unless-stopped

volumes:
  postgres_data:
